name: Clone Zalith Launcher to Repo

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  clone-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone ZalithLauncher2 Files
        run: |
          echo "Cloning ZalithLauncher2 repository..."
          git clone --depth 1 --recurse-submodules https://github.com/ZalithLauncher/ZalithLauncher2 /tmp/zalith_repo
          # Copy files into root workspace
          cp -rn /tmp/zalith_repo/* .
          rm -rf /tmp/zalith_repo

      - name: Commit and Push Cloned Files to GitHub Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Auto-clone ZalithLauncher2 files into repository"
            git push origin HEAD:${{ github.ref_name }}
          fi
