name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      upload_gofile:
        description: 'Upload APK to Gofile.io'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      variant:
        required: false
        default: 'Debug'
        type: string
      upload_gofile:
        required: false
        default: true
        type: boolean
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm64", "arm", "x86_64", "x86"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      VARIANT: ${{ inputs.variant || 'Debug' }}
      UPLOAD_GOFILE: ${{ inputs.upload_gofile != false }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: "on-failure"

      - name: Prepare Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1 || gradle wrapper
          fi
          chmod +x gradlew

      - name: Build APK for ${{ matrix.arch }} (${{ env.VARIANT }})
        run: |
          if [ -f "./gradlew" ] && ./gradlew --version >/dev/null 2>&1; then
            ./gradlew :ZalithLauncher:assemble${{ env.VARIANT }} -Darch=${{ matrix.arch }} --stacktrace
          else
            gradle :ZalithLauncher:assemble${{ env.VARIANT }} -Darch=${{ matrix.arch }} --stacktrace
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zalith-launcher-${{ env.VARIANT }}-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Mapping if Release
        if: env.VARIANT == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload APK to Gofile.io
        if: ${{ success() && env.UPLOAD_GOFILE == 'true' }}
        continue-on-error: true
        run: |
          echo "Scanning for compiled APK files..."
          APK_FILES=$(find ZalithLauncher/build/outputs/apk -type f -name "*.apk")
          if [ -z "$APK_FILES" ]; then
            echo "No APK files found to upload."
            exit 0
          fi
          
          for APK in $APK_FILES; do
            FILE_NAME=$(basename "$APK")
            echo "Uploading $FILE_NAME to Gofile.io..."
            
            SERVER_DATA=$(curl -s https://api.gofile.io/servers || echo "{}")
            SERVER=$(echo "$SERVER_DATA" | jq -r '.data.servers[0].name // empty')
            if [ -z "$SERVER" ]; then
              SERVER="upload"
            fi
            
            UPLOAD_RESULT=$(curl -s -F "file=@${APK}" "https://${SERVER}.gofile.io/contents/uploadfile")
            echo "Gofile response: $UPLOAD_RESULT"
            
            DOWNLOAD_PAGE=$(echo "$UPLOAD_RESULT" | jq -r '.data.downloadPage // empty')
            if [ -n "$DOWNLOAD_PAGE" ]; then
              echo "::notice title=Gofile.io APK Link (${{ matrix.arch }})::Direct Link: $DOWNLOAD_PAGE"
              echo "### 🚀 APK Download Link for ${{ matrix.arch }} (${{ env.VARIANT }})" >> $GITHUB_STEP_SUMMARY
              echo "- **File:** \`$FILE_NAME\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Download URL:** [$DOWNLOAD_PAGE]($DOWNLOAD_PAGE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
